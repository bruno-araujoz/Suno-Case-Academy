services:
  db:
    image: postgres:16
    container_name: suno-content-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: suno_content
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suno_content"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Opcional: `docker compose --profile app up -d --build` sobe UI + banco juntos.
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/suno_content
    env_file:
      - path: .env
        required: false      # chaves de LLM (opcionais para navegar; necessárias para gerar)
    ports:
      - "8001:8000"          # 8001 para não colidir com `uvicorn` local (8000)

volumes:
  pgdata:
