services:
  db:
    image: postgres:16
    container_name: suno-content-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: suno_content
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suno_content"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
