[project]
name = "suno-content"
version = "0.1.0"
description = "Pipeline de adaptação de conteúdo financeiro com avaliador híbrido (Case Suno Academy)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28",
    "aiolimiter>=1.2",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "fastfeedparser>=0.6",
    "selectolax>=1.0",
    "trafilatura>=2.0",
    "pymupdf>=1.25",
    "rapidfuzz>=3.10",
    "xxhash>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
browser = ["crawl4ai>=0.7"]
embed = ["fastembed>=0.5"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: acessa a rede/fontes reais (excluído do Stop hook; rode com -m live)",
    "db: precisa do Postgres local (pulado automaticamente se o banco estiver fora do ar)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]
